<div class="callback-shell">

  @if (!errorMessage) {
    <div class="state-card">
      <span class="spinner-lg" aria-hidden="true"></span>
      <p class="msg">Authentification en cours…</p>
      <p class="sub">Vous allez être redirigé automatiquement.</p>
    </div>
  }

  @if (errorMessage) {
    <div class="state-card error">
      <div class="error-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2.5"/>
          <path d="M16 16l16 16M32 16L16 32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="msg">{{ errorMessage }}</p>
      <button class="btn" (click)="retry()">Retenter la connexion</button>
    </div>
  }

</div>
